<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow-Me · Standort senden</title>

<style>
  :root {
    --bg: #0c1210;
    --panel: #121b18;
    --line: #24332e;
    --text: #e8efe9;
    --dim: #7f9089;
    --accent: #4fd1a5;
    --danger: #e2694f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 20px 20px;
    gap: 16px;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--dim);
    margin: 0;
  }

  .field, .status {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 6px;
  }

  .field b {
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  #toggle {
    background: var(--accent);
    color: #06231a;
  }

  #toggle.active {
    background: var(--danger);
    color: #2a0f09;
  }

  .status {
    font-size: 13px;
    line-height: 1.8;
    color: var(--dim);
  }

  .status b {
    color: var(--text);
    font-weight: 600;
  }

  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 6px;
  }

  .dot.ok { background: var(--accent); }
  .dot.bad { background: var(--danger); }
</style>
</head>

<body>

<h1>FOLLOW-ME — STANDORT SENDEN</h1>

<div class="field">
  <label>SERVER</label>
  <b id="serverText">–</b>
</div>

<button id="toggle">
  Standort senden starten
</button>

<div class="status">
  <div>
    <span id="dotSend" class="dot"></span>
    Senden:
    <b id="sendState">gestoppt</b>
  </div>

  <div>
    <span id="dotGps" class="dot"></span>
    Position:
    <b id="posText">–</b>
  </div>

  <div>
    GPS-Genauigkeit:
    <b id="accuracyText">–</b>
  </div>

  <div>
    Geschwindigkeit:
    <b id="speedText">–</b>
  </div>

  <div>
    Letztes Paket:
    <b id="packetAgeText">–</b>
  </div>

  <div>
    Letzter echter GPS-Fix:
    <b id="fixAgeText">–</b>
  </div>

  <div
    id="errText"
    style="color: var(--danger); margin-top: 6px;"
  ></div>
</div>

<script>
let watchId = null;
let resendTimer = null;
let lastPosition = null;
let lastSent = 0;
let fixCounter = 0;

const toggleBtn =
  document.getElementById("toggle");

const sendState =
  document.getElementById("sendState");

const posText =
  document.getElementById("posText");

const accuracyText =
  document.getElementById("accuracyText");

const speedText =
  document.getElementById("speedText");

const packetAgeText =
  document.getElementById("packetAgeText");

const fixAgeText =
  document.getElementById("fixAgeText");

const errText =
  document.getElementById("errText");

const dotSend =
  document.getElementById("dotSend");

const dotGps =
  document.getElementById("dotGps");

const serverText =
  document.getElementById("serverText");

serverText.textContent =
  window.location.origin;


function endpoint() {
  return "/gps";
}


async function sendFix(position) {

  if (position === null) {
    return;
  }

  const fixAgeMs =
    Math.max(
      0,
      Date.now() - position.receivedAt
    );

  try {

    const response =
      await fetch(
        endpoint(),
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            lat: position.lat,
            lon: position.lon,
            accuracy:
              position.accuracy,
            speed:
              position.speed,
            heading:
              position.heading,
            fixAgeMs:
              fixAgeMs,
            fixId:
              position.fixId
          })
        }
      );


    if (!response.ok) {
      throw new Error(
        "HTTP "
        + response.status
      );
    }


    dotGps.className =
      "dot ok";

    lastSent =
      Date.now();

    errText.textContent =
      "";


  } catch (error) {

    dotGps.className =
      "dot bad";

    errText.textContent =
      "Konnte Server nicht erreichen: "
      + error.message;
  }
}


function onPosition(pos) {

  fixCounter += 1;

  const latitude =
    pos.coords.latitude;

  const longitude =
    pos.coords.longitude;


  const accuracy =
    Number.isFinite(
      pos.coords.accuracy
    )
      ? pos.coords.accuracy
      : 9999;


  const speed =
    Number.isFinite(
      pos.coords.speed
    )
      ? pos.coords.speed
      : null;


  const heading =
    Number.isFinite(
      pos.coords.heading
    )
      ? pos.coords.heading
      : null;


  lastPosition = {
    lat: latitude,
    lon: longitude,
    accuracy: accuracy,
    speed: speed,
    heading: heading,
    receivedAt: Date.now(),
    fixId: fixCounter
  };


  posText.textContent =
    latitude.toFixed(6)
    + ", "
    + longitude.toFixed(6);


  accuracyText.textContent =
    accuracy.toFixed(1)
    + " m";


  speedText.textContent =
    speed === null
      ? "–"
      : speed.toFixed(2)
        + " m/s";


  /*
    Echten neuen GPS-Fix
    sofort senden.
  */
  sendFix(
    lastPosition
  );
}


function onError(error) {

  errText.textContent =
    "GPS-Fehler: "
    + error.message;
}


function startSending() {

  watchId =
    navigator.geolocation
      .watchPosition(
        onPosition,
        onError,
        {
          enableHighAccuracy:
            true,

          maximumAge:
            1000,

          timeout:
            10000
        }
      );


  /*
    4 Hz:

    alle 250 ms wird die
    letzte bekannte Position
    erneut gesendet.

    Wichtig:
    fixId bleibt gleich,
    solange iOS keinen echten
    neuen GPS-Fix liefert.
  */
  resendTimer =
    setInterval(
      () => {
        sendFix(
          lastPosition
        );
      },
      250
    );


  toggleBtn.textContent =
    "Standort senden stoppen";

  toggleBtn.classList.add(
    "active"
  );

  sendState.textContent =
    "aktiv";

  dotSend.className =
    "dot ok";
}


function stopSending() {

  if (watchId !== null) {

    navigator.geolocation
      .clearWatch(
        watchId
      );

    watchId = null;
  }


  if (resendTimer !== null) {

    clearInterval(
      resendTimer
    );

    resendTimer = null;
  }


  lastPosition = null;


  toggleBtn.textContent =
    "Standort senden starten";

  toggleBtn.classList.remove(
    "active"
  );

  sendState.textContent =
    "gestoppt";

  dotSend.className =
    "dot";

  dotGps.className =
    "dot";
}


toggleBtn.addEventListener(
  "click",
  () => {

    if (watchId === null) {
      startSending();
    } else {
      stopSending();
    }
  }
);


/*
  Statusanzeige ebenfalls
  viermal pro Sekunde.
*/
setInterval(
  () => {

    if (lastSent > 0) {

      packetAgeText.textContent =
        (
          (
            Date.now()
            - lastSent
          )
          / 1000
        ).toFixed(1)
        + " s";
    }


    if (
      lastPosition
      !== null
    ) {

      fixAgeText.textContent =
        (
          (
            Date.now()
            - lastPosition.receivedAt
          )
          / 1000
        ).toFixed(1)
        + " s";
    }

  },
  250
);

</script>

</body>
</html>
